name: CI

on:
  push:
    branches:
      - main
      - ml-execution
      - data-workflow
      - feature/data-workflow
      - feature/ml-execution
      - 'feature/**'
  pull_request:
    branches:
      - main
      - ml-execution
      - data-workflow
      - feature/data-workflow
      - feature/ml-execution

jobs:
  validate:
    name: Lint, Typecheck, Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then python -m pip install -r python/requirements.txt; fi

      - name: Install Node dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run Vitest test suites (contracts, mocks, app, core & data libraries)
        run: |
          pnpm run test
          pnpm --filter codebrix-appsdesktop test
          pnpm --filter @codebrix/library-core test
          pnpm --filter @codebrix/library-data test

      - name: Build frontend app
        run: pnpm run build
